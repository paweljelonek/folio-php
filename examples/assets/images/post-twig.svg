<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#g)"/>
  <circle cx="950" cy="200" r="180" fill="#16a34a" opacity="0.15"/>
  <text x="600" y="225" font-family="system-ui,sans-serif" font-size="44" font-weight="800" fill="#fff" text-anchor="middle">Twig Templates</text>
  <text x="600" y="285" font-family="'Courier New',monospace" font-size="18" fill="rgba(255,255,255,0.4)" text-anchor="middle">{% block content %}{% endblock %}</text>
</svg>
